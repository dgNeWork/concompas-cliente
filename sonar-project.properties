sonar.projectKey=dgNeWork_concompas-cliente
sonar.organization=dgnework

sonar.sources=.
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.spec.ts,**/*.spec.tsx,coverage/**

# Archivos que se siguen analizando (bugs, code smells, duplicados) pero que no
# cuentan para el porcentaje de cobertura: configuración de Next, Jest, ESLint y
# PostCSS, y el layout raíz (solo metadata estática de Next, igual que excluye
# Jest en collectCoverageFrom). Al ser el codebase aún pequeño, estos archivos
# pesaban mucho en la media y la cobertura no reflejaba la lógica real testeada.
# app/page.tsx NO se excluye a propósito: será la portada real y debe tener tests.
sonar.coverage.exclusions=next.config.ts,jest.config.mjs,eslint.config.mjs,postcss.config.mjs,app/layout.tsx

sonar.tests=.
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
